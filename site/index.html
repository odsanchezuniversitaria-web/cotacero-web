<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>CotaCero · Prueba web 0.1.24</title>
    <meta name="description" content="">
    <link rel="shortcut icon" href="TemplateData/favicon.ico?build=060b0fee0a06f65a">
    <link rel="stylesheet" href="TemplateData/style.css?build=060b0fee0a06f65a">
    <meta name="cotacero-build" content="060b0fee0a06f65a">
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-canvas-container" style="width: 100%; height: 100%;">
        <canvas id="unity-canvas" style="width: 100%; height: 100%;" tabindex="0" aria-label="Simulador CotaCero"></canvas>
      </div>
      <div id="unity-loading-bar">
        <div id="unity-logo" aria-hidden="true">
          <strong class="unity-brand-name">COTA CERO</strong>
          <span class="unity-brand-caption">LABORATORIO INTERACTIVO</span>
        </div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <p id="unity-loading-status" role="status" aria-live="polite">Preparando el laboratorio… 0 %</p>
        <p id="unity-loading-help">La primera carga puede tardar unos minutos.</p>
        <button id="unity-retry" type="button" hidden>Volver a intentar</button>
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <button id="entervr" type="button" value="Enter VR" disabled title="Preparando el simulador">Entrar / salir de VR</button>
        <button style="display:none" id="enterar" value="Enter AR" disabled>AR</button>
        <div id="unity-webxr-link">WebXR <a href="https://github.com/De-Panther/unity-webxr-export" target="_blank" title="WebXR Export">WebXR Export</a></div>
        <div id="unity-build-title">Al entrar o salir de VR se reinicia la actividad.</div>
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js?build=060b0fee0a06f65a";
      var config = {
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
        dataUrl: buildUrl + "/Web.data?build=060b0fee0a06f65a",
        frameworkUrl: buildUrl + "/Web.framework.js?build=060b0fee0a06f65a",
        codeUrl: buildUrl + "/Web.wasm?build=060b0fee0a06f65a",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Corporacion Universitaria de Bogota",
        productName: "Cota Cero",
        productVersion: "0.1.24",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      canvas.addEventListener("contextmenu", function (event) { event.preventDefault(); });
      var canvasContainer = document.querySelector("#unity-canvas-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var unityInstance = null;
      var loadingStatus = document.getElementById("unity-loading-status");
      var loadingHelp = document.getElementById("unity-loading-help");
      var retryButton = document.getElementById("unity-retry");
      var enterARButton = document.getElementById("enterar");
      var enterVRButton = document.getElementById("entervr");
      var vrSupported = false;
      var arSupported = false;
      var loadingFailed = false;

      function updateXRButtons() {
        var webXR = unityInstance && unityInstance.Module && unityInstance.Module.WebXR;
        enterVRButton.disabled = loadingFailed || !vrSupported || !webXR || typeof webXR.toggleVR !== "function";
        enterARButton.disabled = loadingFailed || !arSupported || !webXR || typeof webXR.toggleAR !== "function";
        enterVRButton.title = !unityInstance ? "Preparando el simulador" : !vrSupported
          ? "VR requiere un visor y un navegador compatible, como Meta Quest Browser."
          : "Al entrar o salir de VR se reinicia la actividad actual.";
      }

      function showLoadError(message) {
        loadingFailed = true;
        loadingBar.style.display = "block";
        loadingStatus.textContent = "No se pudo cargar el laboratorio.";
        loadingHelp.textContent = "Comprueba tu conexión y vuelve a intentarlo. Si estás en celular, cierra otras pestañas.";
        retryButton.hidden = false;
        updateXRButtons();
        console.error("CotaCero:", message);
      }

      retryButton.addEventListener("click", function () { window.location.reload(); });
      document.addEventListener("onARSupportedCheck", function (event) {
        arSupported = !!(event.detail && event.detail.supported);
        updateXRButtons();
      });
      document.addEventListener("onVRSupportedCheck", function (event) {
        vrSupported = !!(event.detail && event.detail.supported);
        updateXRButtons();
      });
      enterARButton.addEventListener("click", function () {
        if (!enterARButton.disabled) unityInstance.Module.WebXR.toggleAR();
      });
      enterVRButton.addEventListener("click", function () {
        if (!enterVRButton.disabled) unityInstance.Module.WebXR.toggleVR();
      });

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onerror = function () { showLoadError("No se pudo descargar el cargador de Unity."); };
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var percent = Math.max(0, Math.min(100, Math.round(100 * progress)));
          progressBarFull.style.width = percent + "%";
          loadingStatus.textContent = percent < 90 ? "Cargando el laboratorio… " + percent + " %"
            : "Preparando la escena… " + percent + " %";
        }).then((instance) => {
          unityInstance = instance;
          updateXRButtons();
          loadingBar.style.display = "none";
          canvas.focus();
          if (fullscreenButton)
          {
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          showLoadError(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
